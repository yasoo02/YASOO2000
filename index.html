<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YSOO200</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:#0b0d15;color:#fff;padding-bottom:50px}
        header{background:#14161e;padding:15px;display:flex;justify-content:space-between;align-items:center;position:fixed;top:0;width:100%;z-index:100}
        .logo{font-weight:800;font-size:1.5rem;color:#e1306c;cursor:pointer}
        nav a{color:#fff;text-decoration:none;margin-left:20px;font-weight:bold;cursor:pointer}
        section{padding:120px 20px;display:none;min-height:100vh}
        section.active{display:block}
        h1{text-align:center;font-size:3rem;margin-bottom:20px}
        .hero p{text-align:center;color:#9ca3af;font-size:1.2rem}
        .features{display:flex;gap:15px;justify-content:center;margin-top:40px;flex-wrap:wrap}
        .feature{background:#14161e;padding:20px;border-radius:10px;border:1px solid #333;text-align:center;width:180px}
        .feature p{font-size:.9rem;color:#9ca3af}
        .filters{display:flex;justify-content:center;gap:10px;margin-bottom:30px;flex-wrap:wrap}
        .filters button{width:auto;padding:10px 20px;border-radius:8px}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}
        .card{background:#14161e;padding:20px;border-radius:10px;text-align:center;border:1px solid #333;position:relative}
        .card h2{font-size:2.2rem;margin:10px 0}
        .card p{color:#9ca3af;margin-bottom:10px}
        .badge{position:absolute;top:10px;right:10px;padding:5px 10px;border-radius:20px;font-size:.7rem;font-weight:bold}
        .badge-fb{background:#1877f2}.badge-ig{background:#e1306c}.badge-tt{background:#FE2C55}
        button{background:#2563eb;border:none;padding:10px;border-radius:5px;color:#fff;width:100%;cursor:pointer;font-weight:bold}
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center}
        .modal.active{display:flex}
        .modal-box{background:#14161e;padding:20px;border-radius:10px;max-width:400px;width:100%}
        input,select{width:100%;padding:10px;margin:5px 0;background:#0b0d15;border:1px solid #333;color:#fff;box-sizing:border-box}
        .admin-page{position:fixed;top:0;left:0;width:100%;height:100%;background:#0b0d15;z-index:2000;display:none;padding:20px;overflow-y:auto}
        .admin-page.active{display:block}
        table{width:100%;border-collapse:collapse;margin-top:10px}
        th,td{border:1px solid #333;padding:8px;text-align:center}
        th{background:#14161e}
        .close{background:#ef4444;margin-top:10px}
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="showPage('home')">YSOO200</div>
        <nav>
            <a onclick="showPage('home')">الرئيسية</a>
            <a onclick="showPage('shop')">الخدمات</a>
        </nav>
    </header>

    <!-- الصفحة الرئيسية -->
    <section id="home" class="active">
        <div class="hero">
            <h1>نمّي حسابك الآن</h1>
            <p>متابعين حقيقيين لإنستغرام وفيسبوك وتيك توك</p>
            <div class="features">
                <div class="feature"><h3>⚡ فوري</h3><p>تنفيذ سريع</p></div>
                <div class="feature"><h3>🛡️ مضمون</h3><p>ضمان مدى الحياة</p></div>
                <div class="feature"><h3>💬 دعم</h3><p>24/7</p></div>
            </div>
        </div>
    </section>

    <!-- صفحة الخدمات -->
    <section id="shop">
        <h2 style="text-align:center;margin-bottom:20px">الخدمات والباقات</h2>
        <div class="filters">
            <button onclick="renderShop('all')">الكل</button>
            <button onclick="renderShop('instagram')">إنستغرام</button>
            <button onclick="renderShop('facebook')">فيسبوك</button>
            <button onclick="renderShop('tiktok')">تيك توك</button>
        </div>
        <div id="grid" class="grid"></div>
    </section>

    <!-- لوحة التحكم (مخفية) -->
    <div id="adminPage" class="admin-page">
        <div style="display:flex;justify-content:space-between;align-items:center">
            <h2>لوحة التحكم</h2>
            <button class="close" onclick="document.getElementById('adminPage').classList.remove('active')">خروج</button>
        </div>
        <div id="stats"></div>
        <h3>الطلبات</h3>
        <div id="ordersDiv"></div>
    </div>

    <!-- نافذة الطلب -->
    <div id="orderModal" class="modal">
        <div class="modal-box">
            <h3 id="modalTitle" style="margin-bottom:10px">طلب المتابعين</h3>
            <select id="orderPlatform">
                <option value="instagram">إنستغرام</option>
                <option value="facebook">فيسبوك</option>
                <option value="tiktok">تيك توك</option>
            </select>
            <input type="number" id="orderQuantity" value="500">
            <input id="orderPrice" readonly>
            <input id="orderAccount" placeholder="رابط الحساب https://...">
            <input id="orderName" placeholder="اسمك">
            <input id="orderContact" placeholder="010...">
            <input type="file" id="paymentProof" accept="image/*">
            <button onclick="placeOrder()">تأكيد الطلب</button>
            <button class="close" onclick="document.getElementById('orderModal').classList.remove('active')">إغلاق</button>
        </div>
    </div>

    <script>
        // إعدادات Firebase
        const db = firebase.initializeApp({ databaseURL: 'https://william-b47a3-default-rtdb.firebaseio.com/' }).database();
        const ADMIN_PASSWORD = 'yassen 312002';

        // الباقات بالأسعار الصحيحة (كما في الكود)
        let packages = [
            {id:'fb1',platform:'facebook',quantity:500,price:25},{id:'fb2',platform:'facebook',quantity:1000,price:50},
            {id:'fb3',platform:'facebook',quantity:2000,price:100},{id:'fb4',platform:'facebook',quantity:3000,price:150},
            {id:'fb5',platform:'facebook',quantity:4000,price:200},{id:'fb6',platform:'facebook',quantity:5000,price:250},
            {id:'fb7',platform:'facebook',quantity:6000,price:300},{id:'fb8',platform:'facebook',quantity:7000,price:350},
            {id:'fb9',platform:'facebook',quantity:8000,price:400},{id:'fb10',platform:'facebook',quantity:9000,price:450},
            {id:'fb11',platform:'facebook',quantity:10000,price:500},{id:'fb12',platform:'facebook',quantity:11000,price:550},
            {id:'fb13',platform:'facebook',quantity:12000,price:600},{id:'fb14',platform:'facebook',quantity:13000,price:650},
            {id:'fb15',platform:'facebook',quantity:14000,price:700},{id:'fb16',platform:'facebook',quantity:15000,price:750},
            {id:'fb17',platform:'facebook',quantity:16000,price:800},{id:'fb18',platform:'facebook',quantity:17000,price:850},
            {id:'fb19',platform:'facebook',quantity:18000,price:900},{id:'fb20',platform:'facebook',quantity:19000,price:950},
            {id:'fb21',platform:'facebook',quantity:20000,price:1000},
            {id:'ig1',platform:'instagram',quantity:500,price:50},{id:'ig2',platform:'instagram',quantity:1000,price:100},
            {id:'ig3',platform:'instagram',quantity:2000,price:200},{id:'ig4',platform:'instagram',quantity:3000,price:300},
            {id:'ig5',platform:'instagram',quantity:4000,price:400},{id:'ig6',platform:'instagram',quantity:5000,price:500},
            {id:'ig7',platform:'instagram',quantity:10000,price:1000},
            {id:'tt1',platform:'tiktok',quantity:500,price:70},{id:'tt2',platform:'tiktok',quantity:1000,price:155},
            {id:'tt3',platform:'tiktok',quantity:2000,price:310},{id:'tt4',platform:'tiktok',quantity:3000,price:465},
            {id:'tt5',platform:'tiktok',quantity:4000,price:620},{id:'tt6',platform:'tiktok',quantity:5000,price:775},
            {id:'tt7',platform:'tiktok',quantity:6000,price:930},{id:'tt8',platform:'tiktok',quantity:7000,price:1085},
            {id:'tt9',platform:'tiktok',quantity:8000,price:1240},{id:'tt10',platform:'tiktok',quantity:9000,price:1395},
            {id:'tt11',platform:'tiktok',quantity:10000,price:1550},{id:'tt12',platform:'tiktok',quantity:11000,price:1705},
            {id:'tt13',platform:'tiktok',quantity:12000,price:1860},{id:'tt14',platform:'tiktok',quantity:13000,price:2015},
            {id:'tt15',platform:'tiktok',quantity:14000,price:2170},{id:'tt16',platform:'tiktok',quantity:15000,price:2325},
            {id:'tt17',platform:'tiktok',quantity:16000,price:2480},{id:'tt18',platform:'tiktok',quantity:17000,price:2635},
            {id:'tt19',platform:'tiktok',quantity:18000,price:2790},{id:'tt20',platform:'tiktok',quantity:19000,price:2945},
            {id:'tt21',platform:'tiktok',quantity:20000,price:3100}
        ];

        // دالة التنقل (الأهم)
        function showPage(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'shop') renderShop('all');
        }

        // دالة عرض الخدمات (تعمل الآن بدون أخطاء)
        function renderShop(filter) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            packages.filter(p => filter === 'all' ? true : p.platform === filter).forEach(pkg => {
                let badge = 'badge-fb', label = 'فيسبوك';
                if(pkg.platform === 'instagram') { badge = 'badge-ig'; label = 'إنستغرام'; }
                if(pkg.platform === 'tiktok') { badge = 'badge-tt'; label = 'تيك توك'; }
                grid.innerHTML += `<div class="card"><span class="badge ${badge}">${label}</span><h2>${pkg.quantity}</h2><p>${pkg.price} ج.م</p><button onclick="openOrder('${pkg.id}')">اطلب الآن</button></div>`;
            });
        }

        // فتح الطلب
        function openOrder(id) {
            const pkg = packages.find(x => x.id === id);
            document.getElementById('modalTitle').innerText = 'طلب ' + pkg.quantity + ' متابعين ' + pkg.platform;
            document.getElementById('orderPlatform').value = pkg.platform;
            document.getElementById('orderQuantity').value = pkg.quantity;
            document.getElementById('orderPrice').value = pkg.price;
            document.getElementById('orderModal').classList.add('active');
        }

        // تأكيد الطلب
        async function placeOrder() {
            const file = document.getElementById('paymentProof').files[0];
            let proofBase64 = null;
            if(file) { proofBase64 = await new Promise(r => { let f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(file); }); }
            const data = {
                invoice: 'INV-' + Date.now().toString().slice(-6),
                name: document.getElementById('orderName').value,
                contact: document.getElementById('orderContact').value,
                platform: document.getElementById('orderPlatform').value,
                account: document.getElementById('orderAccount').value,
                quantity: parseInt(document.getElementById('orderQuantity').value),
                total: parseInt(document.getElementById('orderPrice').value),
                status: 'pending',
                paymentProof: proofBase64
            };
            await db.ref('orders').push(data);
            alert('تم تأكيد الطلب بنجاح!');
            document.getElementById('orderModal').classList.remove('active');
        }

        // لوحة التحكم (تفتح من الرابط ?admin)
        function openAdmin() {
            let pass = prompt("كلمة المرور:");
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('adminPage').classList.add('active');
                loadAdmin();
            } else { alert("كلمة مرور خاطئة"); }
        }

        function loadAdmin() {
            db.ref('orders').on('value', snap => {
                let orders = [];
                snap.forEach(child => orders.push(child.val()));
                document.getElementById('stats').innerHTML = 'إجمالي الطلبات: ' + orders.length;
                let table = '<table><tr><th>الفاتورة</th><th>الاسم</th><th>المنصة</th><th>الحساب</th><th>السعر</th><th>الحالة</th><th>صورة الدفع</th></tr>';
                orders.forEach(o => {
                    let img = o.paymentProof ? `<a href="${o.paymentProof}" target="_blank">عرض</a>` : 'لا يوجد';
                    table += `<tr><td>${o.invoice}</td><td>${o.name}</td><td>${o.platform}</td><td>${o.account}</td><td>${o.total} ج.م</td><td>${o.status}</td><td>${img}</td></tr>`;
                });
                table += '</table>';
                document.getElementById('ordersDiv').innerHTML = table;
            });
        }

        // فتح اللوحة من الرابط
        const params = new URLSearchParams(window.location.search);
        if (params.has('admin')) { openAdmin(); }

        // تحميل الصفحة
        renderShop('all');
    </script>
</body>
</html>
