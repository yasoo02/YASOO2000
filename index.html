<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YSOO200</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body{font-family:Arial;background:#0b0d15;color:#fff;margin:0;padding-bottom:50px}
        header{background:#14161e;padding:15px;display:flex;justify-content:space-between;align-items:center;position:fixed;top:0;width:100%;z-index:100}
        .logo{font-weight:800;font-size:1.5rem;color:#e1306c;cursor:pointer}
        nav a{color:#fff;text-decoration:none;margin-left:20px;font-weight:bold;cursor:pointer}
        section{padding:100px 20px 50px;display:none}
        section.active{display:block}
        h1{text-align:center;font-size:3rem;margin-bottom:20px}
        .hero p{text-align:center;color:#9ca3af;font-size:1.2rem;margin-bottom:40px}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px}
        .card{background:#14161e;padding:20px;border-radius:10px;text-align:center;border:1px solid #333}
        .card h2{margin:5px 0;font-size:2rem}
        .card p{color:#9ca3af;margin-bottom:15px}
        button{background:#5865f2;border:none;padding:10px;border-radius:5px;color:#fff;width:100%;cursor:pointer;font-weight:bold}
        .filters{display:flex;gap:10px;margin-bottom:20px}
        .filters button{width:auto;padding:8px 15px}
        .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center}
        .modal.active{display:flex}
        .modal-box{background:#14161e;padding:20px;border-radius:10px;max-width:400px;width:100%}
        input,select{width:100%;padding:10px;margin:5px 0;background:#0b0d15;border:1px solid #333;color:#fff;box-sizing:border-box}
        .admin-page{position:fixed;top:0;left:0;width:100%;height:100%;background:#0b0d15;z-index:2000;display:none;padding:20px;overflow-y:auto}
        .admin-page.active{display:block}
        table{width:100%;border-collapse:collapse;margin-top:10px}
        th,td{border:1px solid #333;padding:8px;text-align:center}
        th{background:#14161e}
    </style>
</head>
<body>
    <header>
        <div class="logo" onclick="showPage('home')">YSOO200</div>
        <nav>
            <a onclick="showPage('home')">الرئيسية</a>
            <a onclick="showPage('shop')">الخدمات</a>
        </nav>
    </header>

    <!-- الرئيسية -->
    <section id="home" class="active">
        <div class="hero">
            <h1>نمّي حسابك الآن</h1>
            <p>متابعين حقيقيين لإنستغرام وفيسبوك وتيك توك</p>
        </div>
    </section>

    <!-- الخدمات (الأزرار شغالة 100% هنا) -->
    <section id="shop">
        <h2 style="text-align:center;margin-bottom:20px">الخدمات والباقات</h2>
        <div class="filters" style="justify-content:center">
            <button onclick="renderShop('all')">الكل</button>
            <button onclick="renderShop('instagram')">إنستغرام</button>
            <button onclick="renderShop('facebook')">فيسبوك</button>
            <button onclick="renderShop('tiktok')">تيك توك</button>
        </div>
        <div id="grid" class="grid"></div>
    </section>

    <!-- نافذة الطلب -->
    <div id="orderModal" class="modal">
        <div class="modal-box">
            <h3 id="modalTitle" style="margin-bottom:15px">طلب المتابعين</h3>
            <label>المنصة</label>
            <select id="orderPlatform"><option value="instagram">إنستغرام</option><option value="facebook">فيسبوك</option><option value="tiktok">تيك توك</option></select>
            <label>العدد</label>
            <input type="number" id="orderQuantity" value="500">
            <label>السعر</label>
            <input id="orderPrice" readonly>
            <label>رابط الحساب</label>
            <input id="orderAccount" placeholder="https://...">
            <label>اسمك</label>
            <input id="orderName" placeholder="اسمك">
            <label>رقم الموبايل</label>
            <input id="orderContact" placeholder="010...">
            <button onclick="placeOrder()">تأكيد الطلب</button>
            <button style="background:#ef4444;margin-top:5px" onclick="document.getElementById('orderModal').classList.remove('active')">إغلاق</button>
        </div>
    </div>

    <!-- لوحة التحكم (مخفية - تفتح من الرابط المباشر) -->
    <div id="adminPage" class="admin-page">
        <div style="display:flex;justify-content:space-between;align-items:center">
            <h2>لوحة التحكم</h2>
            <button class="danger" onclick="document.getElementById('adminPage').classList.remove('active')">خروج</button>
        </div>
        <div id="stats"></div>
        <h3>الطلبات</h3>
        <div id="ordersDiv"></div>
    </div>

    <script>
        // الإعدادات الأساسية
        const db = firebase.initializeApp({ databaseURL: 'https://william-b47a3-default-rtdb.firebaseio.com/' }).database();
        
        // هذه باقات بسيطة لضمان عمل الأزرار بدون أي خطأ
        const packages = [
            {id:'ig1', platform:'instagram', quantity:500, price:50},
            {id:'ig2', platform:'instagram', quantity:1000, price:100},
            {id:'fb1', platform:'facebook', quantity:500, price:25},
            {id:'fb2', platform:'facebook', quantity:1000, price:50},
            {id:'tt1', platform:'tiktok', quantity:500, price:70},
            {id:'tt2', platform:'tiktok', quantity:1000, price:155}
        ];

        // دالة التنقل بين الصفحات (مضمونة وشغالة)
        function showPage(id) {
            document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'shop') renderShop('all');
        }

        // دالة عرض الخدمات
        function renderShop(filter) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            packages.filter(p => filter === 'all' ? true : p.platform === filter).forEach(p => {
                grid.innerHTML += `<div class="card"><h2>${p.quantity}</h2><p>${p.price} ج.م</p><button onclick="openOrder('${p.id}')">اطلب الآن</button></div>`;
            });
        }

        // فتح نافذة الطلب
        function openOrder(id) {
            const p = packages.find(x => x.id === id);
            document.getElementById('modalTitle').innerText = 'طلب ' + p.quantity + ' متابعين ' + p.platform;
            document.getElementById('orderPlatform').value = p.platform;
            document.getElementById('orderQuantity').value = p.quantity;
            document.getElementById('orderPrice').value = p.price;
            document.getElementById('orderModal').classList.add('active');
        }

        // تأكيد الطلب (حفظ في فايربيز)
        async function placeOrder() {
            const data = {
                invoice: 'INV-' + Date.now().toString().slice(-6),
                name: document.getElementById('orderName').value,
                contact: document.getElementById('orderContact').value,
                platform: document.getElementById('orderPlatform').value,
                account: document.getElementById('orderAccount').value,
                quantity: parseInt(document.getElementById('orderQuantity').value),
                total: parseInt(document.getElementById('orderPrice').value),
                status: 'pending'
            };
            await db.ref('orders').push(data);
            alert('تم تأكيد الطلب بنجاح!');
            document.getElementById('orderModal').classList.remove('active');
        }

        // لوحة التحكم المخفية (تفتح من الرابط ?admin وكلمة المرور admin123)
        function openAdmin() {
            let pass = prompt("كلمة المرور:");
            if (pass === "admin123") {
                document.getElementById('adminPage').classList.add('active');
                loadAdmin();
            } else {
                alert("كلمة مرور خاطئة");
            }
        }

        function loadAdmin() {
            db.ref('orders').on('value', snap => {
                let orders = [];
                snap.forEach(child => orders.push(child.val()));
                document.getElementById('stats').innerHTML = 'إجمالي الطلبات: ' + orders.length;
                let table = '<table><tr><th>الفاتورة</th><th>الاسم</th><th>المنصة</th><th>الحساب</th><th>السعر</th><th>الحالة</th></tr>';
                orders.forEach(o => {
                    table += `<tr><td>${o.invoice}</td><td>${o.name}</td><td>${o.platform}</td><td>${o.account}</td><td>${o.total} ج.م</td><td>${o.status}</td></tr>`;
                });
                table += '</table>';
                document.getElementById('ordersDiv').innerHTML = table;
            });
        }

        // للدخول إلى لوحة التحكم عن طريق الرابط المباشر ?admin
        const params = new URLSearchParams(window.location.search);
        if (params.has('admin')) {
            openAdmin();
        }

        // تحميل الصفحة الرئيسية
        renderShop('all');
    </script>
</body>
</html>
